services:
  postgres:
    image: postgres:18-alpine
    container_name: zythologue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zythologue}
      POSTGRES_USER: ${POSTGRES_USER:-zythologue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres18_cluster:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zythologue} -d ${POSTGRES_DB:-zythologue}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: zythologue-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-zythologue}
      DB_USER: ${POSTGRES_USER:-zythologue}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-zythologue}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./dashboard
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./dashboard/package.json

volumes:
  postgres18_cluster: